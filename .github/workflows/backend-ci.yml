name: backend-ci

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Backend/**', '.github/workflows/backend-ci.yml']

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: Backend

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore KidsPartyVenue.slnx
      - run: dotnet build KidsPartyVenue.slnx --no-restore -c Release
      - run: >
          dotnet test KidsPartyVenue.slnx --no-build -c Release
          --logger trx --results-directory TestResults --logger GitHubActions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Backend/TestResults

  docker-image:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: Backend
          file: Backend/src/KidsPartyVenue.API/Dockerfile
          push: false
          tags: kidspartyvenue-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
