<h1 class="text-h1 desktop:text-h1-lg" i18n="@@search.pageHeading">Pretraga</h1>
<dl>
  <dt i18n="@@search.category">Category</dt>
  <dd>{{ category() ?? '—' }}</dd>

  <dt i18n="@@search.city">City</dt>
  <dd>{{ city() ?? '—' }}</dd>

  <dt i18n="@@search.district">District</dt>
  <dd>{{ district() ?? '—' }}</dd>

  <dt i18n="@@search.date">Date</dt>
  <dd>{{ date() ?? '—' }}</dd>

  <dt i18n="@@search.partOfDay">Part of Day</dt>
  <dd>{{ partOfDay() ?? '—' }}</dd>

  <dt i18n="@@search.kids">Kids</dt>
  <dd>{{ kids() ?? '—' }}</dd>

  <dt i18n="@@search.adults">Adults</dt>
  <dd>{{ adults() ?? '—' }}</dd>
</dl>

<a routerLink="." [queryParams]="{ datum: '2026-11-21' }" queryParamsHandling="merge">Sledeća subota</a>
<a routerLink="." [queryParams]="{ deca: 20 }" queryParamsHandling="merge">20 dece</a>
