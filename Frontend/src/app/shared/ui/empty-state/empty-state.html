<div class="flex flex-col items-center justify-center gap-4 text-center">
  @if (icon(); as iconName) {
    <app-icon [name]="iconName" size="48" class="text-primary-600" />
  }

  @switch (headingLevel()) {
    @case ('h2') {
      <h2 class="text-h2 desktop:text-h2-lg">{{ heading() }}</h2>
    }
    @case ('h3') {
      <h3 class="text-h3">{{ heading() }}</h3>
    }
  }

  @if (message()) {
    <p class="text-text-muted">{{ message() }}</p>
  }
  <ng-content />
</div>
